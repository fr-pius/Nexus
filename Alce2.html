<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ALCE — Nexus</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      background:
        #f2eee4;

      color:
        #252b35;

    }


    .pagina {

      width: min(980px, 92%);

      margin: 0 auto;

      padding: 38px 0 45px;

    }


    /* ============================================================
       CABEÇALHO
       ============================================================ */

    .cabecalho {

      text-align: center;

      margin-bottom: 34px;

    }


    .logo {

      display: block;

      width: min(330px, 72%);

      max-height: 360px;

      object-fit: contain;

      margin: 0 auto 12px;

    }


    .ornamento {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 14px;

      margin: 18px auto 0;

      color:
        #b08a38;

      font-size: 16px;

    }


    .ornamento::before,
    .ornamento::after {

      content: "";

      display: block;

      width: 85px;

      height: 1px;

      background:
        #b08a38;

      opacity: 0.65;

    }


    /* ============================================================
       ÁREA PRINCIPAL
       ============================================================ */

    .painel {

      background:
        #fffdf8;

      border:
        1px solid #d4c8ad;

      border-radius: 4px;

      padding: 32px;

      box-shadow:
        0 5px 20px
        rgba(27, 38, 52, 0.08);

      position: relative;

    }


    .painel::before {

      content: "";

      display: block;

      height: 3px;

      background:
        #b08a38;

      margin:
        -32px -32px 28px;

    }


    .painel h2 {

      margin:
        0 0 24px;

      font-size: 27px;

      font-weight: normal;

      color:
        #1d3048;

    }


    /* ============================================================
       CONTROLE
       ============================================================ */

    .controle {

      display: flex;

      gap: 14px;

      align-items: end;

      flex-wrap: wrap;

    }


    .campo {

      flex: 1;

      min-width: 220px;

    }


    .campo label {

      display: block;

      margin-bottom: 7px;

      font-size: 15px;

      color:
        #4f5968;

    }


    select,
    button {

      width: 100%;

      padding: 11px 13px;

      font: inherit;

      font-size: 16px;

      border-radius: 4px;

    }


    select {

      border:
        1px solid #c8c0b2;

      background:
        #ffffff;

      color:
        #252b35;

    }


    select:focus {

      outline: none;

      border-color:
        #9f7b32;

    }


    button {

      border:
        1px solid #1d3048;

      background:
        #1d3048;

      color:
        white;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;

    }


    button:hover {

      background:
        #263d5b;

      border-color:
        #263d5b;

    }


    .botao {

      width: 150px;

    }


    /* ============================================================
       MENSAGEM
       ============================================================ */

    #mensagem {

      margin-top: 20px;

      color:
        #626b78;

    }


    .erro {

      color:
        #8a3028 !important;

    }


    /* ============================================================
       ADMINISTRAÇÃO DE SOLICITAÇÕES
       ============================================================ */

    .solicitacoes {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #d9cfbc;
    }

    .solicitacoes-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .solicitacoes-titulo {
      font-size: 23px;
      color: #1d3048;
    }

    .solicitacoes-descricao {
      color: #6d675e;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .solicitacao-card {
      border: 1px solid #e0d9cc;
      border-radius: 4px;
      padding: 18px;
      margin: 14px 0;
      background: #fff;
    }

    .solicitacao-origem {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 14px;
      padding: 6px 11px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.35px;
      text-transform: uppercase;
    }

    .solicitacao-origem-cadastro {
      color: #5b477d;
      background: #f0ebf7;
      border-left: 4px solid #8065a8;
    }

    .solicitacao-origem-solicitacao {
      color: #315d70;
      background: #e8f1f4;
      border-left: 4px solid #54879b;
    }

    .solicitacao-campos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px 18px;
    }

    .solicitacao-campo {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.5;
      color: #625f59;
      font-size: 14px;
    }

    .solicitacao-campo strong {
      display: block;
      color: #414b58;
      margin-bottom: 2px;
    }

    .solicitacao-acoes {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee8dd;
    }

    .solicitacao-status {
      flex: 1;
      min-width: 190px;
    }

    .solicitacao-status label {
      display: block;
      margin-bottom: 6px;
      color: #4f5968;
      font-size: 14px;
    }

    .solicitacao-salvar {
      width: 170px;
    }

    .solicitacao-mensagem {
      width: 100%;
      font-size: 13px;
      color: #626b78;
    }

    .solicitacao-vazia {
      padding: 16px 0;
      color: #6d675e;
      font-style: italic;
    }

    .botao-secundario {
      width: auto;
      padding: 8px 12px;
      font-size: 14px;
    }

    /* ============================================================
       RESULTADO
       ============================================================ */

    #resultado {

      margin-top: 30px;

    }


    .titulo-lista {

      font-size: 23px;

      color:
        #1d3048;

      margin-bottom: 15px;

      padding-bottom: 10px;

      border-bottom:
        1px solid #d9cfbc;

    }


    .registro {

      border-top:
        1px solid #e0d9cc;

      padding: 17px 0;

    }


    .registro:first-child {

      border-top: none;

    }


    .nome {

      font-size: 19px;

      margin-bottom: 8px;

      color:
        #27384d;

    }


    .detalhes {

      font-size: 15px;

      line-height: 1.6;

      color:
        #625f59;

    }


    .detalhes strong {

      color:
        #414b58;

    }


    .vazio {

      padding: 20px 0;

      color:
        #6d675e;

      font-style: italic;

    }


/* ============================================================
   FEEDBACK
   ============================================================ */

.feedback {

  margin-top: 30px;

  padding-top: 25px;

  border-top:
    1px solid #d9cfbc;

}

.feedback-titulo {

  font-size: 23px;

  color:
    #1d3048;

  margin-bottom: 8px;

}

.feedback-descricao {

  font-size: 15px;

  color:
    #6d675e;

  margin-bottom: 15px;

}

.feedback textarea {

  display: block;

  width: 100%;

  min-height: 130px;

  padding: 12px;

  resize: vertical;

  font: inherit;

  font-size: 15px;

  line-height: 1.5;

  border:
    1px solid #c8c0b2;

  border-radius: 4px;

  background:
    #ffffff;

  color:
    #252b35;

}

.feedback textarea:focus {

  outline: none;

  border-color:
    #9f7b32;

}

.feedback button {

  width: 190px;

  margin-top: 12px;

}

.mensagem-feedback {

  margin-top: 12px;

  font-size: 14px;

  color:
    #626b78;

}

.mensagem-feedback.sucesso {

  color:
    #3f6844;

}

    /* ============================================================
       RODAPÉ
       ============================================================ */

    .rodape {

      text-align: center;

      margin-top: 28px;

      font-size: 13px;

      color:
        #77736b;

      letter-spacing: 0.5px;

    }


    /* ============================================================
       RESPONSIVO
       ============================================================ */

    @media (max-width: 600px) {

      .pagina {

        width: 94%;

        padding:
          25px 0 35px;

      }


      .logo {

        width: min(270px, 80%);

        margin-bottom: 8px;

      }


      .ornamento::before,
      .ornamento::after {

        width: 55px;

      }


      .painel {

        padding: 22px;

      }


      .painel::before {

        margin:
          -22px -22px 22px;

      }


      .painel h2 {

        font-size: 24px;

      }


      .botao {

        width: 100%;

      }

    }

  </style>

</head>

<body>


  <main class="pagina">


    <!-- ==========================================================
         CABEÇALHO
         ========================================================== -->

    <header class="cabecalho">


      <img
        class="logo"
        src="https://fr-pius.github.io/Alce/logo_nexus.png"
        alt="ALCE — Nexus">


      <div class="ornamento">
        ◆
      </div>


    </header>


    <!-- ==========================================================
         CONSULTA
         ========================================================== -->

    <section class="painel">


      <h2>
        Lista de chegadas
      </h2>


      <div class="controle">


        <div class="campo">

          <label for="mes">
            Mês
          </label>


          <select id="mes" multiple size="4" aria-describedby="ajudaMeses">

            <option value="1">
              Janeiro
            </option>

            <option value="2">
              Fevereiro
            </option>

            <option value="3">
              Março
            </option>

            <option value="4">
              Abril
            </option>

            <option value="5">
              Maio
            </option>

            <option value="6">
              Junho
            </option>

            <option value="7">
              Julho
            </option>

            <option value="8">
              Agosto
            </option>

            <option value="9">
              Setembro
            </option>

            <option value="10">
              Outubro
            </option>

            <option value="11">
              Novembro
            </option>

            <option value="12">
              Dezembro
            </option>

          </select>
          <small id="ajudaMeses">Selecione um ou mais meses. Para selecionar vários, toque ou clique nas opções desejadas.</small>

        </div>


        <div class="botao">

          <button
            onclick="consultarChegadas()">

            Consultar

          </button>

        </div>


      </div>


      <div id="mensagem"></div>

      <section class="solicitacoes" aria-labelledby="tituloSolicitacoes">
        <div class="solicitacoes-cabecalho">
          <div class="solicitacoes-titulo" id="tituloSolicitacoes">Solicitações para avaliação</div>
          <button class="botao-secundario" type="button" onclick="carregarSolicitacoesPendentes()">
            Atualizar solicitações
          </button>
        </div>
        <div class="solicitacoes-descricao">
          Novas solicitações e registros ainda em avaliação. As respostas originais dos formulários são preservadas; somente o Status será atualizado.
        </div>
        <div id="mensagemSolicitacoes" aria-live="polite"></div>
        <div id="listaSolicitacoes"></div>
      </section>

      <div id="resultado"></div>

      <div class="controles-impressao" id="controlesImpressao" style="display: none;">
        <button onclick="imprimirChegadas()">Imprimir</button>
      </div>


    <!-- ==========================================================
         RODAPÉ
         ========================================================== -->

    <footer class="rodape">

      ALCE · Nexus

    </footer>


  </main>


  <script>


    // ============================================================
    // CONSULTA AO NEXUS
    // ============================================================
   let ultimaConsulta = null;
    function consultarChegadas() {


      const meses =
        Array.from(
          document.getElementById("mes").selectedOptions
        ).map(function(opcao) {
          return Number(opcao.value);
        });

      if (!meses.length) {
        mensagem.className = "erro";
        mensagem.textContent = "Selecione pelo menos um mês.";
        resultado.innerHTML = "";
        document.getElementById("controlesImpressao").style.display = "none";
        ultimaConsulta = null;
        return;
      }


      const mensagem =
        document.getElementById("mensagem");


      const resultado =
        document.getElementById("resultado");


      mensagem.className = "";

      mensagem.textContent =
        "Consultando o Nexus...";


      resultado.innerHTML = "";


      google.script.run

        .withSuccessHandler(function(dados) {

  const nomesMeses = meses.map(obterNomeMesInterface);
  const nomeMes = nomesMeses.join(", ");

  ultimaConsulta = {
    lista: dados,
    nomeMes: nomeMes
  };

  mostrarListaChegadas({
    sistema: "Nexus",
    meses: meses,
    nomeMes: nomeMes,
    lista: ultimaConsulta.lista
  });

  mensagem.textContent =
    "Consulta realizada com sucesso.";

  document
    .getElementById(
      "controlesImpressao"
    )
    .style.display = "block";

})


        .withFailureHandler(function(erro) {

          mensagem.className =
            "erro";


          mensagem.textContent =
            "Não foi possível consultar o Nexus: " +
            erro.message;

        })


        .consultarChegadasPeloAlce(meses);

    }


    function obterNomeMesInterface(mes) {

      const meses = [

        "",

        "Janeiro",

        "Fevereiro",

        "Março",

        "Abril",

        "Maio",

        "Junho",

        "Julho",

        "Agosto",

        "Setembro",

        "Outubro",

        "Novembro",

        "Dezembro"

      ];


      return meses[mes] || "";

    }


    // ============================================================
    // APRESENTAÇÃO
    // ============================================================

    function mostrarListaChegadas(dados) {


      const resultado =
        document.getElementById("resultado");


      resultado.innerHTML = "";


      const titulo =
        document.createElement("div");


      titulo.className =
        "titulo-lista";


      titulo.textContent =
        "Chegadas — " +
        dados.nomeMes;


      resultado.appendChild(titulo);


      if (
        !dados.lista ||
        dados.lista.length === 0
      ) {


        const vazio =
          document.createElement("div");


        vazio.className =
          "vazio";


        vazio.textContent =
          "Não há chegadas previstas para os meses selecionados.";


        resultado.appendChild(vazio);


        return;

      }


      dados.lista.forEach(
        function(registro) {


          const bloco =
            document.createElement("div");


          bloco.className =
            "registro";


          const nome =
            document.createElement("div");


          nome.className =
            "nome";


          nome.textContent =
            registro.nome ||
            "Nome não informado";


          const detalhes =
            document.createElement("div");


          detalhes.className =
            "detalhes";


          detalhes.innerHTML =

  "<strong>Chegada:</strong> " +
  formatarData(registro.chegada) +

  "<br>" +

  "<strong>Partida:</strong> " +
  formatarData(registro.partida) +

  "<br>" +

  "<strong>Estado:</strong> " +
  escaparHtml(
    registro.estado || ""
  ) +

  "<br>" +

  "<strong>Motivo:</strong> " +
  escaparHtml(
    registro.motivo || ""
  );


          bloco.appendChild(nome);

          bloco.appendChild(detalhes);


          resultado.appendChild(bloco);

        }
      );

    }


    // ============================================================
    // ADMINISTRAÇÃO DE SOLICITAÇÕES
    // ============================================================

    const statusDisponiveis = [
      "Confirmado",
      "Cancelado",
      "Em andamento",
      "Concluído",
      "Neutro"
    ];

    function carregarSolicitacoesPendentes() {
      const lista = document.getElementById("listaSolicitacoes");
      const mensagem = document.getElementById("mensagemSolicitacoes");
      lista.innerHTML = "";
      mensagem.className = "";
      mensagem.textContent = "Consultando novas solicitações...";

      google.script.run
        .withSuccessHandler(function(solicitacoes) {
          mensagem.textContent = solicitacoes.length
            ? solicitacoes.length + (solicitacoes.length === 1
                ? " solicitação aguardando avaliação."
                : " solicitações aguardando avaliação.")
            : "Não há solicitações pendentes de avaliação.";

          if (!solicitacoes.length) {
            const vazio = document.createElement("div");
            vazio.className = "solicitacao-vazia";
            vazio.textContent = "Todas as solicitações estão com status final ou não há novos registros.";
            lista.appendChild(vazio);
            return;
          }

          solicitacoes.forEach(function(solicitacao) {
            lista.appendChild(criarCartaoSolicitacao(solicitacao));
          });
        })
        .withFailureHandler(function(erro) {
          mensagem.className = "erro";
          mensagem.textContent = "Não foi possível consultar as solicitações: " + erro.message;
        })
        .obterSolicitacoesPendentesNexus();
    }

    function criarCartaoSolicitacao(solicitacao) {
      const cartao = document.createElement("article");
      cartao.className = "solicitacao-card";

      const origem = document.createElement("div");
      origem.className = "solicitacao-origem " +
        (solicitacao.origem === "Cadastro de Hóspedes"
          ? "solicitacao-origem-cadastro"
          : "solicitacao-origem-solicitacao");
      origem.textContent = solicitacao.origem || "Origem não identificada";
      cartao.appendChild(origem);

      const campos = document.createElement("div");
      campos.className = "solicitacao-campos";

      solicitacao.campos.forEach(function(campo) {
        const item = document.createElement("div");
        item.className = "solicitacao-campo";
        const titulo = document.createElement("strong");
        titulo.textContent = campo.nome;
        const valor = document.createElement("span");
        valor.textContent = campo.valor || "Não informado";
        item.appendChild(titulo);
        item.appendChild(valor);
        campos.appendChild(item);
      });

      const acoes = document.createElement("div");
      acoes.className = "solicitacao-acoes";

      const grupoStatus = document.createElement("div");
      grupoStatus.className = "solicitacao-status";
      const rotulo = document.createElement("label");
      rotulo.textContent = "Status";
      const seletor = document.createElement("select");
      statusDisponiveis.forEach(function(status) {
        const opcao = document.createElement("option");
        opcao.value = status;
        opcao.textContent = status;
        seletor.appendChild(opcao);
      });
      if (statusDisponiveis.includes(solicitacao.status)) {
        seletor.value = solicitacao.status;
      } else {
        seletor.value = "Neutro";
      }
      rotulo.appendChild(seletor);
      grupoStatus.appendChild(rotulo);

      const salvar = document.createElement("button");
      salvar.type = "button";
      salvar.className = "solicitacao-salvar";
      salvar.textContent = "Salvar status";

      const retorno = document.createElement("div");
      retorno.className = "solicitacao-mensagem";
      retorno.setAttribute("aria-live", "polite");

      salvar.addEventListener("click", function() {
        const novoStatus = seletor.value;
        salvar.disabled = true;
        retorno.className = "solicitacao-mensagem";
        retorno.textContent = "Atualizando status...";

        google.script.run
          .withSuccessHandler(function(resposta) {
            retorno.textContent = "Status atualizado para “" + resposta.status + "”.";
            retorno.className = "solicitacao-mensagem";
            salvar.disabled = true;
            // Dá tempo para o responsável ler a confirmação e, em seguida,
            // atualiza a fila a partir da planilha, que continua sendo a fonte oficial.
            setTimeout(carregarSolicitacoesPendentes, 1200);
          })
          .withFailureHandler(function(erro) {
            retorno.className = "solicitacao-mensagem erro";
            retorno.textContent = "Não foi possível atualizar: " + erro.message;
            salvar.disabled = false;
          })
          .atualizarStatusSolicitacaoNexus(solicitacao.assinatura, novoStatus);
      });

      acoes.appendChild(grupoStatus);
      acoes.appendChild(salvar);
      acoes.appendChild(retorno);
      cartao.appendChild(campos);
      cartao.appendChild(acoes);
      return cartao;
    }

    // ============================================================
    // DATAS
    // ============================================================

    function formatarData(valor) {


      if (!valor) {

        return "Não informada";

      }


      const data =
        new Date(valor);


      if (
        isNaN(
          data.getTime()
        )
      ) {

        return valor;

      }


      return data.toLocaleString(
        "pt-BR",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }


    // ============================================================
    // SEGURANÇA
    // ============================================================

    function escaparHtml(texto) {


      return texto

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

    // =========================================================
// ABRIR FOLHA DE CHEGADAS
// =========================================================

function imprimirChegadas() {

  if (!ultimaConsulta) {

    return;

  }

  const lista =
    ultimaConsulta.lista;
    
  const nomeMes =
    ultimaConsulta.nomeMes;


  google.script.run

    .withSuccessHandler(function(url) {

      window.open(
        url,
        "_blank"
      );

    })

    .withFailureHandler(function(erro) {

      alert(
        "Não foi possível abrir a folha de impressão: " +
        erro.message
      );

    })

    .prepararFolhaChegadas(
      lista,
      nomeMes
    );

}

function enviarFeedback() {

  const campo =
    document.getElementById("comentario");

  const mensagem =
    document.getElementById("mensagemFeedback");

  const comentario =
    campo.value.trim();

  if (!comentario) {

    mensagem.className =
      "mensagem-feedback erro";

    mensagem.textContent =
      "Por favor, escreva um comentário.";

    return;
  }

  mensagem.className =
    "mensagem-feedback";

  mensagem.textContent =
    "Enviando comentário...";

  google.script.run

    .withSuccessHandler(function() {

      campo.value = "";

      mensagem.className =
        "mensagem-feedback sucesso";

      mensagem.textContent =
        "Comentário enviado. Muito obrigado!";

    })

    .withFailureHandler(function(erro) {

      mensagem.className =
        "mensagem-feedback erro";

      mensagem.textContent =
        "Não foi possível enviar o comentário: " +
        erro.message;

    })

    .registrarFeedback(comentario);
}

    // Carrega a fila ao abrir o Nexus.
    carregarSolicitacoesPendentes();

  </script>


</body>
